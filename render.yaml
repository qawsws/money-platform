services:
  - type: web
    name: money-platform
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: money-platform-db
          property: connectionString

databases:
  - name: money-platform-db
    databaseName: money_platform
    user: money_platform
